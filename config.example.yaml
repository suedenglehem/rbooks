# library-rag configuration (example).
#
# Copy to `config.yaml` (or point $LIBRARY_RAG_CONFIG at a file) and fill in the
# real operator paths. Every path below is a placeholder. Paths are validated at
# load time: managed roots must be disjoint from each other and from source roots,
# and a managed root may never be nested inside a read-only source root.
#
# Secrets (api_token) are better supplied via the LIBRARY_RAG_API_TOKEN env var.

paths:
  # Read-only directories scanned for PDF/EPUB. May be a list of several roots.
  source_roots:
    - /mnt/models_sas_ssd/books

  # Writable roots. archive_root + artifact_root on the big disk; state_root and
  # qdrant_root on SSD; scratch_root on SSD (hard-capped at 50 GB by default).
  archive_root: /mnt/models_sas_ssd/library-rag/archive
  artifact_root: /mnt/models_sas_ssd/library-rag/artifacts
  state_root: /mnt/models_sata_ssd/library-rag/state
  qdrant_root: /mnt/models_sata_ssd/library-rag/qdrant
  model_root: /mnt/models_sas_ssd/library-rag/models
  scratch_root: /mnt/models_sata_ssd/library-rag/scratch

services:
  # Either a remote Qdrant server (host/port) or a LOCAL embedded instance.
  # qdrant_path is preferred when no server is installed (M6 pilot runs local).
  qdrant_path: /mnt/models_sata_ssd/library-rag/qdrant
  qdrant_host: 127.0.0.1
  qdrant_port: 6333
  # llama.cpp answer-model server (OpenAI-compatible /v1/chat/completions).
  # One model per server, so the embedding model has its own endpoint.
  # On this machine: vLLM qwen3.8-27b (FP8, TP=2) on :8091.
  answer_host: 127.0.0.1
  answer_port: 8091
  # Connect-phase timeout (seconds) for the LLM answer endpoints (answer model
  # and the resume pool). Kept separate from the generation timeouts
  # (answer.timeout_seconds / resume.timeout_seconds): a LAN connect is
  # sub-millisecond, so this only caps how long a dead or packet-dropping
  # endpoint (e.g. a stopped llama-server behind a stateful firewall) can
  # pin a pool thread before per-call failover kicks in. Default: 2.0.
  # connect_timeout_seconds: 2.0
  # llama.cpp embedding-model server (OpenAI-compatible /v1/embeddings).
  # SINGLE-HOST by design: every port in the pool lives on this ONE
  # embed_host — `embed_ports` are replicas of the same model on the same
  # machine (e.g. one llama-server per GPU), not endpoints on different
  # machines. There is no multi-host support; to use a second machine, point
  # embed_host at it and (re)bind its replicas' ports there.
  #
  # `embed_ports` is the pool of replicas, default [8081] (single replica).
  # Requests round-robin across the ports; a request that fails on one
  # endpoint (5xx, timeout) is retried on the next replica in rotation.
  #
  # Note: the embedder uses a flat 120 s per-request timeout with NO
  # connect-phase budget (unlike the LLM pool above, which honors
  # connect_timeout_seconds). A dead or packet-dropping replica therefore
  # costs up to 120 s per bounced request before failover moves on.
  embed_host: 127.0.0.1
  embed_ports: [8081]
  # Run more replicas by listing every port (one llama-server per port):
  # embed_ports: [8081, 8082, 8083, 8084]
  # FastAPI app bind. Keep loopback unless the operator opts into LAN exposure
  # (which then requires api_token). Avoid :8000/:8081/:8091 (occupied).
  app_host: 127.0.0.1
  app_port: 8100
  # Bearer-token requirement — two parts, OFF by default (local runs need no
  # token and the web UI never shows its token field):
  #   api_token:         the token VALUE. Keep it a fixed value in the config
  #                      file; $LIBRARY_RAG_API_TOKEN (env) overrides it.
  #   require_api_token: the master switch. When true, every non-static
  #                      request needs Authorization: Bearer <api_token> and
  #                      the web UI shows the token field; when false the
  #                      value is inert. A non-loopback bind with the switch
  #                      off starts with a loud warning (PRD §12 recommends
  #                      bearer auth before any network exposure).
  # api_token: "library-rag-local"
  # require_api_token: true
  # Local-machine convenience, opt-in: when true, the reader manifest
  # (GET /books/{rev_id}) carries the book's full source path and the web UI
  # shows it in the reader pane above the located content. Off by default —
  # a deployed app must not leak server filesystem layout.
  # show_path_to_original: true

# Embedding model (PRD §6/§8F). The exact model + revision — never a bare
# family name. Changing this value changes the embedding key and forces fresh
# checkpoints, but not re-extraction. embedding.fake is for tests only.
#
# MEASURED CONSTRAINTS (2026-09-19, pilot): bge-m3 is 1024-dim with an 8192
# trained context, so there is no trained-context cap. However llama.cpp
# rejects a SINGLE input longer than the server's physical batch size: the
# running instance on :8081 reports 512, and inputs above ~510 BPE tokens are
# rejected (500, "increase the physical batch size"). embedder.sh already
# passes --batch-size 2048, so restarting the operator's server would raise
# the per-input ceiling to 2048 tokens. Measured word->BPE ratios for this
# model: EN 1.39 / DE 1.69 / FR 1.65 (incl. ~2 special tokens); measured
# throughput ~7000 tok/s on a batch of 8 (~3.5x the old BCE server).
#
# The GGUF at /dd2/llama-server/bge-m3-q8_0.gguf is 627 MiB, Q8_0,
# sha256:aa473d51f451a22f0fcf39ba3330c14bed38a385712b1113440f69df4047a173.
embedding:
  model_revision: bge-m3@Q8_0-aa473d51
  model_name: bge-m3-q8_0
  dimensions: 1024

# Chunking. target_tokens is the per-chunk WORD budget (the WordTokenCounter
# unit), not BPE tokens. Keep it low enough that target_tokens * worst-case
# word->BPE ratio + title stays under the embedder's per-input ceiling.
# Measured ratios: bge-m3 EN 1.39 / DE 1.69 / FR 1.65; BCE EN 1.36 / DE 1.61 /
# FR 1.77 (kept as the conservative worst case). At the running server's
# 512 per-input BPE ceiling, 256*1.77+2 ~= 455 leaves a measured margin.
# After a server restart with --batch-size 2048, target_tokens could rise to
# ~1000 words. The pilot run measures the actual per-chunk BPE distribution
# (via the server's usage field) and the pilot report freezes this value.
chunking:
  target_tokens: 256
  overlap_tokens: 40

# Retrieval (PRD §9). All counts default sensibly; the one M6 pilot finding
# that matters at library scale is stats_epoch.
#
# stats_epoch controls how the BM25 corpus-statistics epoch is resolved. The
# epoch hash includes the document count, so in "live" mode it moves on every
# real publish, and every stale-epoch republish job pays a full O(corpus)
# recompute to discover it. Measured in the M6 pilot: ~99.9% of the 13k
# publish jobs were stale-epoch no-ops, each paying ~4.2 s of recompute —
# that recompute WAS the 15 h publish tail. Projected to the full 35k-book
# corpus, "live" is O(N^2): roughly 700 h of recompute plus ~42B re-upserted
# sparse points.
#   live   (default) — exact; every publish may move the epoch and fans out
#              stale-epoch republishes. Fine for small/interactive corpora.
#   frozen — pins the epoch to the last committed record for the whole
#              campaign: no per-book recompute, zero fan-out. A new book's
#              novel terms get zero sparse weight until re-freeze.
#              Campaign-end re-freeze recipe: set stats_epoch to "live", run
#              `DELETE FROM meta WHERE key='corpus_stats_epoch';` in the state
#              DB, then the next publish (any new book, or one manual
#              republish) recomputes once over the full corpus and its
#              fan-out converges everything in one bounded round.
# RECOMMENDED for the full-library ingestion: frozen (see M6 pilot report).
retrieval:
  stats_epoch: frozen

# Answer model for cited answering (PRD §12). The exact model + revision.
# A server that is down at answer time fails the answer explicitly; search
# keeps working. answer.fake is for tests only.
answer:
  model_revision: qwen3.8-27b-fp8@vllm-dual-max
  model_name: qwen3.8-27b
  max_tokens: 1024
  temperature: 0.1
  timeout_seconds: 60
  # M9: extra endpoints serving the SAME model, load-balanced with per-call
  # failover alongside services.answer_host:answer_port. An endpoint that is
  # down costs its (fast, 10s) connect timeout per affected call and the pool
  # degrades to the live ones — safe to leave configured while the machine is
  # off. model_name inherits `answer.model_name` when omitted.
  # Selection is least-inflight per unit of weight (round-robin breaks idle
  # ties): with every weight at 1, dispatch settles at each endpoint's
  # relative SPEED, so the faster endpoint naturally carries more. Raise a
  # weight (default 1, >= 1) to route that endpoint a share beyond its
  # natural one — the usual move is raising the PRIMARY's weight to keep
  # batch load off a secondary that also serves interactive traffic.
  # weight: 1
  # extra_endpoints:
  #   - host: ak
  #     port: 8080
  #     weight: 1

# Extended per-book summaries ("resumes", M8): after a revision is published,
# a `resume` job asks the answer model (identity always from `answer` above)
# for a 700-1000 word English summary, stored for the web UI's keyword search.
# Generation parameters are deliberately longer/looser than cited answering.
# A resume shorter than 100 words fails its job permanently — bump max_tokens
# and requeue with `library-rag retry --include-permanent`.
resume:
  enabled: true
  max_tokens: 2400
  temperature: 0.3
  timeout_seconds: 300
  prompt_version: resume-v1
  input_char_budget: 16000

# Filesystem browse (M10): a web-UI tab that navigates the books root by hand.
# Listing is relative to `root`; directories are always shown (drill-down),
# files only when their suffix (case-insensitive) is in `file_types`. A file
# already in the catalog shows its stored résumé on right-click and opens in
# the reader on click; a file not in the index yet is shown, muted. OFF by
# default — enable it with an absolute root (e.g. one of the source_roots
# above). A root that disappears (mount pulled) degrades the feature only:
# the tab hides itself and /browse/* 404s until the directory exists again.
# browse:
#   enabled: true
#   root: /mnt/models_sas_ssd/books
#   file_types: [.pdf, .epub, .PDF, .EPUB]

# Ingest-worker execution (M9). max_concurrent_jobs is the worker's job thread
# pool: 1 (default) is the original strictly-sequential loop; >1 runs several
# claimed jobs at once, which is what lets multiple LLM endpoints
# (answer.extra_endpoints) drain a backfill in parallel.
worker:
  max_concurrent_jobs: 1

# Short-log + per-job verbose-log configuration. Source of truth for detached
# worker runs; the --log-level / --log-format CLI flags override these for a
# single interactive invocation.
#   level:           one of DEBUG, INFO, WARNING, ERROR (default INFO)
#   format:          human or json (default human) — the short log's line format
#   job_log_retention: max per-job failure logs kept under <state_root>/job_logs
#                      (oldest pruned first); default 500
logging:
  level: INFO
  format: human
  job_log_retention: 500

# Sentinel files that must exist to prove each mount is present. A missing mount
# must never cause scans or writes to an empty fallback directory.
mount_sentinels:
  books: /mnt/models_sas_ssd/books/.library-rag-sentinel

# GPU assignments by UUID (not by assumed CUDA index). See PRD §11.
# Example:
# gpu_profiles:
#   bulk:
#     embedding_gpus:
#       - GPU-0bdf9519-aae5-32f0-9cd6-32d22d6466c2
#       - GPU-aa23843f-62cb-e34a-a69d-03c36905903d
#   interactive:
#     answer_gpu: GPU-4fccb0bc-ead6-3306-6d15-b1d1cb6f8f9c
#     embedding_gpus: []
#     rerank_gpu: GPU-4fccb0bc-ead6-3306-6d15-b1d1cb6f8f9c
